name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- CI：配置 + 编译 + 测试 ----------
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: 编译
        run: cmake --build build -j

      - name: 运行测试
        run: cd build && ctest --output-on-failure